<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" style="max-width:100%;height:auto;" preserveAspectRatio="xMidYMid meet">
  <title>共享式总线与交换式以太网对比：冲突域从整根总线缩小到单个端口</title>
  <desc>左侧：host-a、host-b、host-c 三台主机各用一条短竖线挂在同一根共享总线上，红色虚线框标出冲突域为整根总线，同一时刻只能有一台发送；右侧：三台主机各自独占交换机 switch-1 的一个端口，一帧按 MAC 地址从 host-a 转发到 host-c，每条主机到端口的链路各自是一个冲突域，冲突域缩小到单个端口。</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect width="780" height="440" fill="#fafafa"/>

  <text x="390" y="40" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="bold" fill="#0d47a1">共享式总线 vs 交换式：冲突域的变化</text>

  <!-- 左右两个 zone：用不同颜色边框区分，小标题压在 zone 顶边上（衬底与背景同色） -->
  <rect x="24" y="64" width="338" height="280" rx="8" fill="none" stroke="#42a5f5" stroke-width="1.5"/>
  <rect x="119" y="54" width="148" height="20" rx="2" fill="#fafafa"/>
  <text x="193" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#1565c0">共享式总线 / 集线器</text>

  <rect x="418" y="64" width="338" height="280" rx="8" fill="none" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="548" y="54" width="78" height="20" rx="2" fill="#fafafa"/>
  <text x="587" y="68" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#1565c0">交换式</text>

  <!-- 先画线，后画框 -->
  <!-- 左半：三条短竖线（drop line）+ 一根共享粗总线 -->
  <line x1="80" y1="172" x2="80" y2="220" stroke="#0d47a1" stroke-width="2"/>
  <line x1="193" y1="172" x2="193" y2="220" stroke="#0d47a1" stroke-width="2"/>
  <line x1="306" y1="172" x2="306" y2="220" stroke="#0d47a1" stroke-width="2"/>
  <line x1="56" y1="224" x2="330" y2="224" stroke="#0d47a1" stroke-width="8" stroke-linecap="round"/>

  <!-- 右半：三条独占链路；其中 host-a → switch-1 → host-c 一帧的转发路径用蓝色箭头 -->
  <path d="M479,244 L479,170" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="587" y1="244" x2="587" y2="160" stroke="#0d47a1" stroke-width="2"/>
  <path d="M695,160 L695,234" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- 冲突域：红色虚线框（左 1 个大框 = 整根总线；右 3 个小框 = 单个端口） -->
  <rect x="32" y="108" width="322" height="144" rx="6" fill="none" stroke="#ef5350" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="128" y="98" width="130" height="20" rx="2" fill="#fafafa"/>
  <text x="193" y="112" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#ef5350">冲突域＝整根总线</text>

  <rect x="433" y="174" width="92" height="120" rx="6" fill="none" stroke="#ef5350" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="541" y="174" width="92" height="120" rx="6" fill="none" stroke="#ef5350" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="649" y="174" width="92" height="120" rx="6" fill="none" stroke="#ef5350" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="533" y="298" width="108" height="20" rx="2" fill="#fafafa"/>
  <text x="587" y="312" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#ef5350">冲突域＝单个端口</text>

  <!-- 左半：三台主机 -->
  <g>
    <rect x="44" y="128" width="72" height="44" rx="6" fill="#ffffff" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="80" y="156" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="bold" fill="#0d47a1">host-a</text>
  </g>
  <g>
    <rect x="157" y="128" width="72" height="44" rx="6" fill="#ffffff" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="193" y="156" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="bold" fill="#0d47a1">host-b</text>
  </g>
  <g>
    <rect x="270" y="128" width="72" height="44" rx="6" fill="#ffffff" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="306" y="156" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="bold" fill="#0d47a1">host-c</text>
  </g>

  <!-- 右半：交换机与三台主机 -->
  <g>
    <rect x="465" y="104" width="244" height="56" rx="6" fill="rgba(66,165,245,0.15)" stroke="#1565c0" stroke-width="1.5"/>
    <text x="587" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="bold" fill="#0d47a1">switch-1</text>
    <text x="587" y="148" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#1565c0">按 MAC 地址转发</text>
  </g>
  <g>
    <rect x="443" y="244" width="72" height="44" rx="6" fill="#ffffff" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="479" y="272" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="bold" fill="#0d47a1">host-a</text>
  </g>
  <g>
    <rect x="551" y="244" width="72" height="44" rx="6" fill="#ffffff" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="587" y="272" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="bold" fill="#0d47a1">host-b</text>
  </g>
  <g>
    <rect x="659" y="244" width="72" height="44" rx="6" fill="#ffffff" stroke="#0d47a1" stroke-width="1.5"/>
    <text x="695" y="272" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="bold" fill="#0d47a1">host-c</text>
  </g>

  <!-- 左半说明文字 -->
  <text x="193" y="280" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#666666">共享总线：所有主机共享同一介质</text>
  <text x="193" y="304" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#0d47a1">同一时刻只能有一台发送</text>

  <!-- 右半转发路径说明 -->
  <text x="587" y="334" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#1565c0">host-a 的帧按 MAC 地址转发到 host-c</text>

  <!-- 图例（底部水平条带） -->
  <line x1="60" y1="384" x2="720" y2="384" stroke="#42a5f5" stroke-width="1"/>
  <line x1="134" y1="404" x2="170" y2="404" stroke="#0d47a1" stroke-width="8" stroke-linecap="round"/>
  <text x="178" y="408" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#0d47a1">共享总线</text>
  <line x1="258" y1="404" x2="294" y2="404" stroke="#0d47a1" stroke-width="2"/>
  <text x="302" y="408" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#0d47a1">主机链路</text>
  <path d="M382,404 L408,404" fill="none" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="426" y="408" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#0d47a1">帧按 MAC 地址转发</text>
  <rect x="569" y="396" width="30" height="16" rx="2" fill="none" stroke="#ef5350" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="607" y="408" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#0d47a1">冲突域</text>
</svg>
